
name: Build Data

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Packages
        uses: actions/checkout@v4
        with:
          path: ./editor-packages
          persist-credentials: false

      - name: Checkout Editor
        uses: actions/checkout@v4
        with:
          repository: EliasDevX9/editor2
          ref: dev
          path: ./editor
          fetch-depth: 0
          token: ${{ secrets.EDITOR_DATA_PACKAGES }}

      - name: Setup Deno
        uses: denolib/setup-deno@v2
        with:
          deno-version: v1.37.X

      - name: Build Data
        run: |
          cd ./editor-packages
          deno task build
          mv packages.zip ../editor/public
          mv dataPackage.ts ../editor/src/utils/app

      - name: Commit and Push
        run: |
          cd ./editor

          git config user.name "EliasDevX9"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Update Minecraft Bedrock editor data"
            git push origin dev
          else
            echo "No changes to publish"
          fi
